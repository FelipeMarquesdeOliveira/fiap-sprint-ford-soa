spring.application.name=vinshare
server.port=${PORT:8085}

# ---------- Banco de dados (MySQL) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vinshare?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:fiap}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# db/seed contém dados de demonstração (remova em produção)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Paginação: formato estável ({content, page}) e limite de itens por página (evita consultas massivas)
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.max-page-size=100

# ---------- Segurança / JWT ----------
# Em produção, defina JWT_SECRET (mínimo de 32 caracteres) como variável de ambiente.
api.security.jwt.secret=${JWT_SECRET:vinshare-dev-secret-troque-em-producao-2026}
api.security.jwt.issuer=vinshare-api
api.security.jwt.audience=vinshare-clients
api.security.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:PT15M}
api.security.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:P7D}
api.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}

# ---------- Erros: nunca expor stack trace / mensagens internas ----------
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- Documentação OpenAPI ----------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.default-produces-media-type=application/json
